name: 灯台データの更新

on:
  schedule:
    - cron: "17 3 1 * *"     # 毎月1日 12:17（日本時間）
  workflow_dispatch:           # 手動実行（Actions タブの「Run workflow」）
  push:
    paths:
      - "tools/build_lights.py"
      - ".github/workflows/lights.yml"

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: 灯台データを取得
        run: python3 tools/build_lights.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lights
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "灯台データを更新（$(date -u +%Y-%m-%d)）"
          git pull --rebase origin main
          git push
