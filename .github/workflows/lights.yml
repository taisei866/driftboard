name: 灯台データの更新

on:
  schedule:
    - cron: "17 3 3 * *"     # 毎月3日 12:17（日本時間）に作り直し
  workflow_dispatch:           # 手動実行（Actions タブの「Run workflow」）
  push:
    paths:
      - "tools/build_lights.py"

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - name: 道具を用意
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -q osmium
      - name: 灯台データを取得
        run: python3 -u tools/build_lights.py
      - name: 変更があればコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/lights data/lights_work 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "灯台データを更新（$(date -u +%Y-%m-%d)）"
          git pull --rebase origin main
          git push
