name: 灯台データの更新

on:
  schedule:
    - cron: "17 3 * * *"     # 毎日 12:17（日本時間）。作り直しは月1回、途中で止まった分はここで続きを再開
  workflow_dispatch:           # 手動実行（Actions タブの「Run workflow」）
  push:
    paths:
      - "tools/build_lights.py"

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - name: 灯台データを取得
        env:
          BUDGET_MIN: "250"
        run: python3 -u tools/build_lights.py
      - name: 変更があればコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/lights data/lights_work 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "灯台データを更新（$(date -u +%Y-%m-%d)）"
          git pull --rebase origin main
          git push
